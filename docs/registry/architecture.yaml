# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: run_end_condition_raised
    status: active
    pattern: direct_call
    producer: "player-controller (T7 wipe, T8 victory) AND crafting-and-items (C.5.8 BCT-DEFEAT) — multiple callers, one contract"
    consumers:
      - run-controller
    adr: docs/architecture/adr-0002-runcontroller-architecture.md
    signal_signature: "RunEndConditionRaised(conditionType: \"wipe\" | \"victory\", squadState: SquadStateSnapshot): ()"
    referenced_by:
      - docs/architecture/adr-0002-runcontroller-architecture.md
    added: 2026-07-06
    revised: ""
    note: "RATIFIED by the user 2026-07-06 — server-internal only, MUST NOT be placed under a Knit service's .Client sub-table (see forbidden_patterns)."

  - contract: run_ended
    status: active
    pattern: signal
    producer: run-controller
    consumers:
      - hud
      - analytics
      - player-controller (own T7/T8 terminal-state cleanup)
    adr: docs/architecture/adr-0002-runcontroller-architecture.md
    signal_signature: "RunEnded(exitReason: \"wipe\" | \"victory\", squadState: SquadStateSnapshot, timestamp: number) — fired exactly once per run"
    referenced_by:
      - docs/architecture/adr-0002-runcontroller-architecture.md
    added: 2026-07-06
    revised: ""
    note: "RATIFIED by the user 2026-07-06 — no longer pending."

  - contract: request_squad_oxygen_spend
    status: active
    pattern: direct_call
    producer: player-controller
    consumers:
      - resource-management
    adr: docs/architecture/adr-0005-death-respawn-lifecycle.md
    signal_signature: "RequestSquadOxygenSpend(deadPlayerUserId: number, amount: number, reason: string, deathEventId: string): () — deduplicated by resource-management on (deadPlayerUserId, deathEventId)"
    referenced_by:
      - docs/architecture/adr-0005-death-respawn-lifecycle.md
      - docs/architecture/adr-0004-disturbanceservice-core-architecture.md
    added: 2026-07-06
    revised: ""
    note: "PENDING RATIFICATION — added on a 60s AskUserQuestion timeout per this project's established precedent (adopt recommended option, flag pending)."

