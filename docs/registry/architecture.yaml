# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: knitstart_time_cross_service_construction
    status: active
    description: "A service must never construct an object, signal, or accessor
      inside KnitStart if another service might need to synchronously read or
      call it during that other service's own KnitStart. All such objects must
      be constructed during KnitInit instead."
    why: "Knit guarantees all KnitInits complete before any KnitStart fires, but
      gives no ordering guarantee between different services' KnitStart calls.
      Constructing a cross-service-visible object in KnitStart risks another
      service's KnitStart running first and finding the object missing."
    adr: docs/architecture/adr-0001-knit-lifecycle-ordering-discipline.md
    added: 2026-07-06
    note: "RATIFIED by the user 2026-07-06 — no longer pending."

  - pattern: registration_handshake_across_actor_boundary
    status: active
    description: "RegistrationHandshake modules must only be require()'d from the
      default serial script context, never from inside an Actor used for
      parallel Luau execution."
    why: "require() module-cache identity is scoped per Luau execution context.
      require()-ing the same ModuleScript from inside an Actor returns a
      separate cached table from the main serial context, silently breaking
      the RegistrationHandshake singleton assumption with no error."
    adr: docs/architecture/adr-0001-knit-lifecycle-ordering-discipline.md
    added: 2026-07-06
    note: "RATIFIED by the user 2026-07-06 — no longer pending. Binding until/unless a future ADR explicitly re-examines parallel Luau adoption."

  - pattern: run_end_condition_raised_exposed_as_client_method
    status: active
    description: "RunController's RunEndConditionRaised method must never be placed
      under a Knit service's .Client sub-table, and must never be reachable by a
      RemoteFunction/RemoteEvent a game client can fire directly."
    why: "RunEndConditionRaised ends the run for the whole squad on a single call
      with no server-side validation of the caller's claim (it trusts the caller
      to have already determined the condition is true). Exposing it to clients
      would let any connected player fire a fake wipe/victory and end the run for
      everyone — a server-authority breach."
    adr: docs/architecture/adr-0002-runcontroller-architecture.md
    added: 2026-07-06
    note: "RATIFIED by the user 2026-07-06 — no longer pending."

  - pattern: async_charge_without_post_yield_recheck
    status: active
    description: "Any async cross-service call using the Pending/InFlight/Committed/Abandoned
      state machine (ADR-0005) must re-check row.state == \"InFlight\" AFTER the yield
      resolves, before treating the call as committed. Never treat pcall's ok==true as
      proof of a real yield having completed if the callee could ever return a Promise
      instead of yielding synchronously."
    why: "pcall does not await a Promise — it reports ok=true the instant a Promise
      object is constructed, not once it resolves. If a callee is ever made genuinely
      async via a Promise without the caller awaiting it inside the pcall, this silently
      defeats the entire double-commit race guard the state machine exists for."
    adr: docs/architecture/adr-0005-death-respawn-lifecycle.md
    added: 2026-07-06
    note: "PENDING RATIFICATION — added on a 60s AskUserQuestion timeout per this project's established precedent (adopt recommended option, flag pending)."

  - pattern: knitinit_hard_error_without_shutdown_catch
    status: active
    description: "Every KnitInit-time config-validation hard error (error(...)) is only
      effective if the server bootstrap's Knit.Start() catch handler actually halts the
      server instance (e.g., game:Shutdown()) rather than only logging the rejection."
    why: "The common Knit bootstrap boilerplate (Knit.Start():andThen(print):catch(warn))
      only LOGS a rejected KnitInit promise — Roblox has no implicit crash-on-uncaught-
      error at the process level. Without an explicit hard-stop in the catch handler, a
      misconfigured constant that error()s at KnitInit would silently fail to block
      server startup, defeating every KnitInit-time hard-error requirement project-wide
      (this project's own H.3d/H.3e and R7c-I4 included)."
    adr: docs/architecture/adr-0005-death-respawn-lifecycle.md
    added: 2026-07-06
    note: "PENDING RATIFICATION — added on a 60s AskUserQuestion timeout per this project's established precedent (adopt recommended option, flag pending). Binding project-wide, not just ADR-0005's own check."

  - pattern: silent_drop_for_remotefunction
    status: active
    description: "The silent-drop-on-reject convention (ADR-0006) applies to fire-and-forget
      RemoteEvents ONLY. Any future RemoteFunction must always return a value on every
      code path, including rejection — never a silent drop."
    why: "An un-returned RemoteFunction invocation leaves the calling client's coroutine
      yielded indefinitely — a real Roblox footgun if the RemoteEvent-oriented silent-drop
      pattern is copied verbatim onto a synchronous RemoteFunction call."
    adr: docs/architecture/adr-0006-remoteevent-trust-boundary.md
    added: 2026-07-06
    note: "PENDING RATIFICATION — added on a 60s AskUserQuestion timeout per this project's established precedent (adopt recommended option, flag pending)."

  - pattern: second_datastore_persistence_surface
    status: active
    description: "No system other than save-load-cosmetic-persistence may call
      ProfileStore or DataStoreService, for any purpose."
    why: "Architecture Principle #5 ('Rounds, not saves') makes cosmetic/meta-progression
      persistence the SOLE persistence surface in the entire game — every other system's
      state is discarded at run end by construction. A second persistence surface would
      violate this principle even if well-intentioned (e.g., a tempting 'just persist this
      one run-stat' addition)."
    adr: docs/architecture/adr-0007-save-load-cosmetic-persistence.md
    added: 2026-07-06
    note: "PENDING RATIFICATION — added on a 60s AskUserQuestion timeout per this project's established precedent (adopt recommended option, flag pending)."

  - pattern: anchoring_predator_root_part
    status: active
    description: "The predator's HumanoidRootPart must never be Anchored (e.g., to
      implement a freeze/stagger state) — use Humanoid.WalkSpeed = 0 instead."
    why: "SetNetworkOwner(nil) (ADR-0008, required for the predator's server-authoritative
      positioning) throws an error if called on an Anchored part. Anchoring the predator's
      root part at any point would break the predator's NetworkOwnership on the next call."
    adr: docs/architecture/adr-0008-character-replication-bandwidth-networkownership.md
    added: 2026-07-06
    note: "PENDING RATIFICATION — added on a 60s AskUserQuestion timeout per this project's established precedent (adopt recommended option, flag pending)."

