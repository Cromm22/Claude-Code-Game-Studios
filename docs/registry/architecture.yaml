# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: cross_service_signal
    status: active
    api: "Knit's bundled Signal class (RbxUtil) via Signal.new()"
    not: "Instance.new(\"BindableEvent\") for new cross-service signals"
    adr: docs/architecture/adr-0001-knit-lifecycle-ordering-discipline.md
    reason: "Signal:Fire() dispatch synchronicity is a plain-Luau-call guarantee, independent of Workspace.SignalBehavior (which governs BindableEvent and has been drifting toward Deferred across Roblox releases)."
    referenced_by:
      - docs/architecture/adr-0001-knit-lifecycle-ordering-discipline.md
    added: 2026-07-06
    revised: ""
    note: "RATIFIED by the user 2026-07-06 — no longer pending."

  - purpose: cross_service_live_registration
    status: active
    api: "require()-cached RegistrationHandshake module (module-private, not a Knit service)"
    not: "Knit.GetService() when a live registration (not just a signal read) must cross the undefined KnitStart-order boundary"
    adr: docs/architecture/adr-0001-knit-lifecycle-ordering-discipline.md
    reason: "require() module-cache identity is independent of Knit's KnitInit/KnitStart lifecycle, so it works regardless of which service's KnitStart runs first. Generalized from Ecological Disturbance's ED<->Predator AI RegistrationHandshake design."
    referenced_by:
      - docs/architecture/adr-0001-knit-lifecycle-ordering-discipline.md
    added: 2026-07-06
    revised: ""
    note: "RATIFIED by the user 2026-07-06 — no longer pending."

  - purpose: locomotion_driver
    status: active
    api: "Humanoid (WalkSpeed, MoveDirection, Humanoid:MoveTo(), PathfindingService:FindPathAsync-driven NPC pursuit)"
    not: "Character Controller Library (post-cutoff full release) for either Player Controller or Predator AI"
    adr: docs/architecture/adr-0003-locomotion-driver.md
    reason: "Zero rewrite cost to already-approved GDD ACs phrased in Humanoid terms; ratifies Predator AI's own OQ.7 recommendation; lower live-platform documentation risk for NPC pathfinding-driven pursuit specifically. Explicitly re-evaluated at the /prototype predator-ai spike, not a permanently closed decision."
    referenced_by:
      - docs/architecture/adr-0003-locomotion-driver.md
      - docs/architecture/adr-0008-character-replication-bandwidth-networkownership.md
    added: 2026-07-06
    revised: ""
    note: "PENDING RATIFICATION — added on a 60s AskUserQuestion timeout per this project's established precedent (adopt recommended option, flag pending)."

  - purpose: spatial_index
    status: active
    api: "Plain Luau table-of-tables spatial hash grid (grid[cellX][cellZ] = {sourceId, ...}), cell size 32 studs"
    not: "Region3 / Workspace:FindPartsInRegion3-family APIs"
    adr: docs/architecture/adr-0004-disturbanceservice-core-architecture.md
    reason: "Region3 queries physical BasePart Instances in Workspace; disturbance sources are pure data (position+magnitude+age), not physical Instances — using Region3 would require spawning invisible marker Parts purely to be queryable, real overhead for a purely data-structural problem a plain table already solves in O(1)."
    referenced_by:
      - docs/architecture/adr-0004-disturbanceservice-core-architecture.md
    added: 2026-07-06
    revised: ""
    note: "PENDING RATIFICATION — added on a 60s AskUserQuestion timeout per this project's established precedent (adopt recommended option, flag pending)."

  - purpose: streaming_chunk_membership
    status: active
    api: "Server-computed, position-based heuristic (player's server-tracked position within STREAMING_PUSH_RADIUS of a chunk's center)"
    not: "Player.ReplicationFocus (client-writable, already banned in ecological-disturbance.md's own H.31b) or any other client-driven streaming signal"
    adr: docs/architecture/adr-0004-disturbanceservice-core-architecture.md
    reason: "No client-writable property or client-fired signal may gate server-authoritative push decisions. The position heuristic requires no uncertain post-cutoff API and its worst-case failure mode (early/late push) is a bandwidth nicety, not a security issue."
    referenced_by:
      - docs/architecture/adr-0004-disturbanceservice-core-architecture.md
    added: 2026-07-06
    revised: ""
    note: "PENDING RATIFICATION — added on a 60s AskUserQuestion timeout per this project's established precedent (adopt recommended option, flag pending)."

  - purpose: async_cross_service_charge_pattern
    status: active
    api: "Pending -> InFlight -> Committed/Abandoned state machine with a post-yield ownership re-check (re-verify row.state == \"InFlight\" AFTER a yield resolves, before committing)"
    not: "Fire-and-forget async calls for any cross-service charge where a double-commit or lost-charge would be a correctness bug"
    adr: docs/architecture/adr-0005-death-respawn-lifecycle.md
    reason: "Protects against a staleness-sweep re-arming a row to Pending (and re-dispatching) WHILE the original call is still yielding — without the post-yield re-check, the original call's late success could double-commit against the re-dispatched attempt's own commit."
    referenced_by:
      - docs/architecture/adr-0005-death-respawn-lifecycle.md
    added: 2026-07-06
    revised: ""
    note: "PENDING RATIFICATION — added on a 60s AskUserQuestion timeout per this project's established precedent (adopt recommended option, flag pending). Reusable project-wide for any future async cross-service charge, per Architecture Principle #4."

  - purpose: remote_event_validation_order
    status: active
    api: "6-step canonical order: (1) alive/state guard, (2) per-event rate limit + burst cap, (3) global per-player budget, (4) payload shape validation, (5) server-side plausibility re-derivation, (6) deep/domain validation"
    not: "Any RemoteEvent handler skipping or reordering these steps, or mutating state before a check fails"
    adr: docs/architecture/adr-0006-remoteevent-trust-boundary.md
    reason: "Generalizes Player Controller's own existing per-event pattern (C.9's drop-first ordering) as the binding project-wide standard for every client-fired RemoteEvent, so new events don't reinvent or under-implement it."
    referenced_by:
      - docs/architecture/adr-0006-remoteevent-trust-boundary.md
    added: 2026-07-06
    revised: ""
    note: "PENDING RATIFICATION — added on a 60s AskUserQuestion timeout per this project's established precedent (adopt recommended option, flag pending)."

  - purpose: player_character_network_ownership
    status: active
    api: "Default automatic NetworkOwnership (Roblox standard — owning client simulates its own character's physics)"
    not: "Forcing explicit server NetworkOwnership on player characters"
    adr: docs/architecture/adr-0008-character-replication-bandwidth-networkownership.md
    reason: "Movement/visual feedback is explicitly permitted to be client-predicted per game-concept.md; gameplay-consequential outcomes are already protected by RemoteEvent server validation (ADR-0006), not by physics ownership. Forcing server ownership would remove local responsiveness for zero server-authority benefit."
    referenced_by:
      - docs/architecture/adr-0008-character-replication-bandwidth-networkownership.md
    added: 2026-07-06
    revised: ""
    note: "PENDING RATIFICATION — added on a 60s AskUserQuestion timeout per this project's established precedent (adopt recommended option, flag pending)."

  - purpose: predator_network_ownership
    status: active
    api: "Explicit server NetworkOwnership via HumanoidRootPart:SetNetworkOwner(nil)"
    not: "Any client-owned physics for the predator NPC"
    adr: docs/architecture/adr-0008-character-replication-bandwidth-networkownership.md
    reason: "The predator has no owning client; its position is entirely server-driven via PathfindingService results. Ratifies predator-ai.md's own existing GDD design. Must be re-invoked on every predator respawn/recreate (SetNetworkOwner is per part-instance, not persisted on a template) and must never be called on an Anchored part (throws)."
    referenced_by:
      - docs/architecture/adr-0008-character-replication-bandwidth-networkownership.md
    added: 2026-07-06
    revised: ""
    note: "PENDING RATIFICATION — added on a 60s AskUserQuestion timeout per this project's established precedent (adopt recommended option, flag pending)."

