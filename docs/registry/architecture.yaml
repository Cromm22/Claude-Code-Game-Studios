# ─── PERFORMANCE BUDGETS ──────────────────────────────────────────────────────
# Frame time allocations per system, against a defined total frame budget.
# Conflicts: allocations that sum to more than the total budget = unshippable.
#
# Register a budget when an ADR explicitly claims a frame time allocation.
# The registry lets /architecture-review verify the total doesn't exceed the target.

performance_budgets:
  - system: remote_event_global_budget
    status: active
    budget_ms: null
    notes: "Per-player global RemoteEvent budget: 30 accepted fires/sec across ALL client-fired events (tumbling 1.0s window), on top of each event's own per-event rate limit + burst cap. Derived from summing current per-event limits at their busiest legitimate combination (~21.3/s) with headroom; re-derive if a future high-frequency event is added."
    adr: docs/architecture/adr-0006-remoteevent-trust-boundary.md
    referenced_by:
      - docs/architecture/adr-0006-remoteevent-trust-boundary.md
    added: 2026-07-06
    revised: ""
    note: "PENDING RATIFICATION — added on a 60s AskUserQuestion timeout per this project's established precedent (adopt recommended option, flag pending)."

  - system: character_replication_baseline
    status: active
    budget_ms: null
    notes: "Provisional 15-30 KB/s baseline per-client bandwidth for character replication (Humanoid/HumanoidRootPart state, N players + 1 predator), BEFORE any game-specific signal (ED's ~8.2 KB/s, HUD, PA broadcasts) is added, against the <50 KB/s per-client advisory ceiling. UNVERIFIED — pending empirical measurement at the /prototype predator-ai spike; every other system's bandwidth budget should subtract from the MEASURED baseline once it exists, not the full 50 KB/s ceiling."
    adr: docs/architecture/adr-0008-character-replication-bandwidth-networkownership.md
    referenced_by:
      - docs/architecture/adr-0008-character-replication-bandwidth-networkownership.md
    added: 2026-07-06
    revised: ""
    note: "PENDING RATIFICATION — added on a 60s AskUserQuestion timeout per this project's established precedent (adopt recommended option, flag pending)."

