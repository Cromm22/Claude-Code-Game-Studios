# Terranova — Entity Registry
#
# Cross-system facts. Single source of truth for any value referenced by more than
# one GDD. New GDDs check this file before naming an entity, item, formula, or
# constant. Conflicts must be surfaced before the conflicting GDD is locked.
#
# Created: 2026-04-29 — seeded by /design-system ecological-disturbance
# Maintained by: /design-system (writes new entries) + /consistency-check (audits)
#
# Schema per entry:
#   - name: string                      # globally unique within its category
#     category: enum                    # constant | formula | entity | item | enum
#     value: <typed>                    # the canonical value
#     unit: string (optional)           # e.g. "studs", "seconds", "Hz"
#     source: string                    # owning GDD relative path
#     referenced_by: [string]           # GDD paths that consume this value

