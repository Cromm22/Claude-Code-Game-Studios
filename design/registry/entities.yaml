formulas:
  - name: magnitudeDecay
    category: formula
    expression: "m(t, age) = initialMagnitude * exp(-lambda * math.max(0, age))"
    variables: [initialMagnitude, age, lambda]
    output_range: [0.0, 1.0]
    source: design/gdd/ecological-disturbance.md (D.1)
    referenced_by: []
    notes: "Server clock MUST be workspace:GetServerTimeNow() (Roblox monotonic server clock; documented not to jump backward). os.clock(), os.time(), and tick() are FORBIDDEN as canonical sources per D.1. math.max(0, age) guard is defense-in-depth against same-Heartbeat-frame equal-timestamp edge cases. Updated 2026-04-29 round-3 revision (round-2 D.1 ruling propagated to registry)."

  - name: squadAggregateT
    category: formula
    expression: "GetSquadAggregateT(excludePlayer: Player?) -> squadT = if remainder(connectedPlayers minus excludePlayer) is empty then (if connectedPlayers is empty then 0.0 else max over ALL connected players) else max(fieldValue(pi.position) for pi in the remainder); nil argument -> unfiltered max over all connected players"
    variables: [pi, excludePlayer]
    output_range: [0.0, 1.0]
    source: design/gdd/ecological-disturbance.md (D.5 exclusion-form paragraph, D.6b)
    referenced_by: [design/gdd/predator-ai.md, design/gdd/hud.md]
    revised: 2026-07-05
    notes: "UPDATED 2026-07-05 (cross-review C6 — the prior zero-arg entry was the pre-round-23 form whose lack of exclusion made PA's Hunt→Disengage structurally unreachable, ED round-23 B1). Exclusion form (round-23): PA's quiet-check reads GetSquadAggregateT(excludeLockedPlayer); nil → unfiltered D.5 max (HUD path unchanged); empty remainder → UNFILTERED max (lone player's own T, PA H.57 solo semantics — never 0/nil on a non-empty server); zero connected players → 0.0 (E.15/H.22b); D.5/playerT finiteness guards apply (ED round-22/24). Verified by ED H.22c. Server-internal only, never on Service.Client."

  - name: canisterCycleTime
    category: formula
    expression: "canisterCycleTime_best = BIOMASS_PER_CANISTER * (TAP_HOLD_COMMIT_DURATION + NODE_EXTRACT_TIME_LIGHT) + CRAFT_TIME_CANISTER"
    variables: [BIOMASS_PER_CANISTER, TAP_HOLD_COMMIT_DURATION, NODE_EXTRACT_TIME_LIGHT, CRAFT_TIME_CANISTER]
    output_range: [9.1, 18.0]
    source: design/gdd/resource-node.md (D.1)
    referenced_by: [design/gdd/resource-management.md]
    notes: "Best-case (zero-travel) gather->craft->use cycle for one Oxygen Canister. HARD floor (RM D.6): must exceed CRAFT_CONCURRENCY_CAP * CANISTER_RESTORE_OXYGEN / OXYGEN_DRAIN_BC3 = 2*10/2.2 = 9.09 s. At defaults = 10.0 s (+0.91 s margin). Server-init assert (RN H.12). Supersedes RM's stale ~8 s dependency-table provisional (RM line 241, OQ.7). BIOMASS_PER_CANISTER=2, CRAFT_TIME_CANISTER=2 s both Crafting-locked."

  - name: spatialFalloffContribution
    category: formula
    expression: "contribution(P, S) = m(t, age) * max(0, 1 - dist2D(P, S) / INFLUENCE_RADIUS)^2"
    variables: [m, dist2D, INFLUENCE_RADIUS]
