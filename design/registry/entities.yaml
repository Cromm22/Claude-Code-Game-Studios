  - name: STAMINA_MAX
    category: constant
    value: 100
    unit: dimensionless (units)
    source: design/gdd/player-controller.md (C.2, G.2)
    referenced_by: [design/gdd/hud.md]
    notes: "Maximum stamina. Abstract units, not seconds, preserve drain/regen tuning independence. Range: 60-200. Config-validation gate (round-28 T-4, systems NEW-1, H.12a clause (v)): rejected at <= 0 (and below the 60 range floor). A negative STAMINA_MAX makes the D.1/D.2 math.clamp(x, 0, STAMINA_MAX) evaluate min > max and THROW on every Heartbeat tick — a hard per-frame crash; STAMINA_MAX = 0 is a permanent forced-walk degenerate. Previously only STAMINA_DRAIN_RATE was sign-gated."

  - name: STAMINA_DRAIN_RATE
    category: constant
    value: 12.5
    unit: units/s
    source: design/gdd/player-controller.md (C.2, D.1, G.2)
    referenced_by: []
    notes: "Drain rate while sprinting. 100 / 12.5 = 8s of full sprint at max stamina. Range: 8-20. Coupled with STAMINA_REGEN_RATE — adjust as a pair. Config-validation gate (Player Controller H.12a clause (ii)): STAMINA_DRAIN_RATE > 0 is a load-bearing sign-gate, rejected at <= 0 (D.3 T_sprint = s_0 / STAMINA_DRAIN_RATE / C.2.2 time-to-empty divide-by-zero). round-30 systems-IMPORTANT: this annotation aligns the row with its three stamina siblings (STAMINA_MAX/REGEN_RATE/REGEN_DELAY), which each already document their H.12a clause (v) gate — DRAIN_RATE is the original sign-gate but was the only stamina knob whose row omitted the gate annotation."

  - name: STAMINA_REGEN_RATE
    category: constant
    value: 10
    unit: units/s
    source: design/gdd/player-controller.md (C.2, D.2, G.2)
    referenced_by: []
    notes: "Regen rate while not sprinting and past STAMINA_REGEN_DELAY. Intentionally slower than drain (ratio 0.8). Range: 5-18. Config-validation gate (round-28 T-4, H.12a clause (v); threshold reconciled round-28 systems-B1): rejected below the G.2 range floor (< 5) — a < 0 value silently DRAINS stamina during rest, a 0-4 value is below-range degraded/never-recovering. (Prior note said 'rejected at < 0', which disagreed with the H.12a >= 5 floor.)"

  - name: STAMINA_REGEN_DELAY
    category: constant
    value: 1.5
    unit: seconds
    source: design/gdd/player-controller.md (C.2, D.2, G.2)
    referenced_by: []
    notes: "Wait window after sprint stops, before regen begins. Prevents bar-twitch on tap-sprint micro-inputs. Range: 0.5-4.0s. Resets on each sprint-end event (no banking of partial delay progress). Boundary comparator (R6-I1): regen begins when (t - t_sprint_end) is STRICTLY GREATER THAN this value, i.e. the D.2 gate is `> STAMINA_REGEN_DELAY`, not `>=` — at exactly t_sprint_end + 1.5s the player is still in the delay window (regen begins on the first tick strictly past the boundary). Biases toward the player having paid the full delay before recovery starts. Config-validation gate (round-28 T-4, H.12a clause (v); threshold reconciled round-28 systems-B2): rejected below the G.2 range floor (< 0.5) — a < 0 value is a nonsensical pre-emptive regen, a 0-0.49 value is the below-range bar-twitch degenerate. (Prior note said 'rejected at < 0', which disagreed with the H.12a >= 0.5 floor.)"

