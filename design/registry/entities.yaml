  - name: BEACON_HALF_LIFE
    category: constant
    value: 90
    unit: seconds
    source: design/gdd/ecological-disturbance.md
    referenced_by: [design/gdd/crafting-and-items.md]
    notes: "Half-life for Beacon emission. Range: TIGHTENING to 64-128s (was 45-180s). CROSS-GDD LOCK RESOLVED (round-5, CD ruling R4-1, 2026-06-02; Crafting G.6 / OQ.14 CLOSED): BEACON_SURVIVAL_WINDOW = BEACON_HALF_LIFE * log2(0.95/0.65) = BEACON_HALF_LIFE * 0.5476 (at 90s -> ~49s). The Crafting survival-window design-safe band [35,70]s requires BEACON_HALF_LIFE in [64,128]s; the old [45,180]s produced windows ~[25,99]s (too short to demand aid at the low end, dead-wait at the high end). CD ruled: ED TIGHTENS BEACON_HALF_LIFE to [64,128]s; Crafting does NOT decouple (the 'window = ED lure interval' identity is preserved). ED applies the registry range edit at its next revision (forward obligation, Crafting F.4 ED row). Default 90s is inside the new band. ROUND-9 (2026-06-03, Crafting Blocker #7): Crafting now enforces a fail-fast INIT ASSERTION (Crafting G.6 / H.105) that the DERIVED window = BEACON_HALF_LIFE * 0.5476 falls in [35,70]s, refusing to start otherwise — so an as-yet-unapplied ED range edit cannot reach a live run with a degenerate (~25s bunker-through or ~99s dead-wait) window. The authoritative range tightening to [64,128]s remains ED's to apply (ED-owned constant; Crafting reads it and asserts, but does not edit it unilaterally per coordination rules)."

