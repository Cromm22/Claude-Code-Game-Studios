formulas:
  - name: magnitudeDecay
    category: formula
    expression: "m(t, age) = initialMagnitude * exp(-lambda * math.max(0, age))"
    variables: [initialMagnitude, age, lambda]
    output_range: [0.0, 1.0]
    source: design/gdd/ecological-disturbance.md (D.1)
    referenced_by: []
    notes: "Server clock MUST be workspace:GetServerTimeNow() (Roblox monotonic server clock; documented not to jump backward). os.clock(), os.time(), and tick() are FORBIDDEN as canonical sources per D.1. math.max(0, age) guard is defense-in-depth against same-Heartbeat-frame equal-timestamp edge cases. Updated 2026-04-29 round-3 revision (round-2 D.1 ruling propagated to registry)."

  - name: squadAggregateT
    category: formula
    expression: "squadT = if connectedPlayers is empty then 0.0 else max(fieldValue(pi.position) for each connected player pi)"
    variables: [pi]
    output_range: [0.0, 1.0]
    source: design/gdd/ecological-disturbance.md (D.5, D.6b)
    referenced_by: []
    notes: "Empty-player guard required to avoid math.max() on empty arg list (E.15, H.22b). NaN guard delegated to E.16 emission-time schema validation (D.5 prose note). Server-internal accessor D.6b GetSquadAggregateT() returns the same value for predator Retreat-trigger logic; not exposed via Knit Service.Client."

  - name: spatialFalloffContribution
    category: formula
    expression: "contribution(P, S) = m(t, age) * max(0, 1 - dist2D(P, S) / INFLUENCE_RADIUS)^2"
    variables: [m, dist2D, INFLUENCE_RADIUS]
    output_range: [0.0, 1.0]
    source: design/gdd/ecological-disturbance.md (D.2)
    referenced_by: []

  - name: fieldValueAtPosition
    category: formula
    expression: "fieldValue(P) = min(1.0, sum over live sources of contribution(P, Si))"
    variables: [P, Si]
    output_range: [0.0, 1.0]
    source: design/gdd/ecological-disturbance.md (D.3)
    referenced_by: []

  # Player Controller formulas (encoded 2026-04-30).

  - name: staminaDrain
    category: formula
    expression: "stamina_new = clamp(stamina - STAMINA_DRAIN_RATE * dt, 0, STAMINA_MAX)"
    variables: [stamina, STAMINA_DRAIN_RATE, dt, STAMINA_MAX]
    output_range: [0, 100]
    source: design/gdd/player-controller.md (D.1)
    referenced_by: []
    notes: "Per-Heartbeat stamina deduction while in S2 (Alive-Sprinting). dt sourced from RunService.Heartbeat event arg (typical 1/60s server, up to 1/30s on slow servers). Clamp to 0 prevents negative on lag spike."

  - name: staminaRegen
    category: formula
    expression: "stamina_new = clamp(stamina + STAMINA_REGEN_RATE * dt, 0, STAMINA_MAX)"
    variables: [stamina, STAMINA_REGEN_RATE, dt, STAMINA_MAX]
    output_range: [0, 100]
    source: design/gdd/player-controller.md (D.2)
    referenced_by: []
    notes: "Per-Heartbeat stamina recovery while NOT in S2 AND past STAMINA_REGEN_DELAY. Delay is gated by caller, not by this formula."

  - name: effectiveSprintDuration
    category: formula
    expression: "T_sprint(s_0) = s_0 / STAMINA_DRAIN_RATE"
    variables: [s_0, STAMINA_DRAIN_RATE]
    output_range: [0.0, 8.0]
    source: design/gdd/player-controller.md (D.3)
    referenced_by: []
    notes: "Seconds of uninterrupted sprint until forced-walk, given starting stamina. Maximum 8.0s at s_0 = STAMINA_MAX = 100."

  - name: pulseEmissionMagnitude
    category: formula
    expression: "axis = emissionType; grace_eligible = (t_lastGracePulse[axis] == nil) OR ((t_0 - t_lastGracePulse[axis]) >= GRACE_REENTRY_COOLDOWN); effective_d = (d_xz < MOBILE_ANALOG_DRIFT_THRESHOLD AND platform == 'touch') ? 0 : d_xz; if grace_eligible AND (t - t_0) <= FIRST_PULSE_GRACE_WINDOW: magnitude_base AND record t_lastGracePulse[axis] = t_0; elif effective_d < EMITTER_MOVEMENT_DELTA_FLOOR: magnitude_base * STATIONARY_EMISSION_FACTOR; else: magnitude_base"
    variables: [t, t_0, d_xz, effective_d, axis, t_lastGracePulse, MOBILE_ANALOG_DRIFT_THRESHOLD, EMITTER_MOVEMENT_DELTA_FLOOR, FIRST_PULSE_GRACE_WINDOW, GRACE_REENTRY_COOLDOWN, magnitude_base, STATIONARY_EMISSION_FACTOR, platform]
    output_range: [0.024, 0.10]
    source: design/gdd/player-controller.md (D.4)
    referenced_by: []
    notes: "Pulse magnitude sent to DisturbanceService:Emit for Sprint or Light pulses. Discrete output set: {0.024, 0.03, 0.08, 0.10}. Drift floor applies on touch only (PC/gamepad bypass to avoid false-stationary classification). Round-2 Theme 1 G1 closure: grace_eligible preflight gates the grace-window branch via per-axis cooldown (t_lastGracePulse[axis], GRACE_REENTRY_COOLDOWN = 6.0s default). Without preflight, round-1 micro-cadence exploits cycled at 31% cost-per-pulse for Sprint, 10x for Light."

  - name: xzDisplacement
    category: formula
    expression: "d_xz = sqrt((x_n - x_{n-1})^2 + (z_n - z_{n-1})^2)"
    variables: [x_n, z_n, x_{n-1}, z_{n-1}]
    output_range: [0.0, infinity]
    source: design/gdd/player-controller.md (D.6)
    referenced_by: []
    notes: "XZ-plane displacement of HumanoidRootPart between consecutive pulse fire events. Y/vertical motion discarded (jump-in-place produces 0). First-pulse special case: previous position = state-entry position; result is consumed by D.4 grace branch and unused."

  # Crafting & Items formulas (encoded 2026-04-30).

  - name: craftProgress
    category: formula
    expression: "craftProgress_new = clamp(craftProgress + craftRate * dt, 0, 1); craftRate = 1.0 / CRAFT_BASE_DWELL_TIME * effective_N (D.2)"
    variables: [craftProgress, craftRate, dt, CRAFT_BASE_DWELL_TIME, effective_N]
    output_range: [0.0, 1.0]
    source: design/gdd/crafting-and-items.md (D.1, D.2)
    referenced_by: []
    notes: "Per-Heartbeat craft progress accumulator. dt sourced from RunService.Heartbeat (typically 1/60s). Clamp to 1.0 prevents BT3 double-fire on overflow tick (per H.29). effective_N is the multi-crafter dwell-rate scalar (D.2)."

  - name: multiCrafterDwellRate
    category: formula
    expression: "effective_N = min(N, benchMaxCraftersEffective) where N = |CraftSession.crafters| and benchMaxCraftersEffective = min(BENCH_MAX_CRAFTERS, ceil(squadSize/2))"
    variables: [N, benchMaxCraftersEffective, BENCH_MAX_CRAFTERS, squadSize]
    output_range: [1, 2]
    source: design/gdd/crafting-and-items.md (D.2, C.3.5)
    referenced_by: []
    notes: "Multi-crafter dwell-time scalar. N=1 gives 1× rate; N=2 gives 2× rate (half wall-clock dwell). Clamped at the squad-scaled benchMaxCraftersEffective (round-2 2026-06-01: was a flat BENCH_MAX_CRAFTERS) to enforce E.2 over-cap rejection. In a 2-player squad the effective cap is 1, so the speedup is unavailable (BS3 unreachable). Progress preserved when N changes mid-craft (per H.31)."

  - name: multiCrafterEmissionDispatch
    category: formula
    expression: "for crafter in CraftSession.crafters: DisturbanceService:Emit(emissionType='Craft', position=benchPosition, initialMagnitude=recipeBurstMagnitude, sourcePlayerId=crafter.UserId)"
    variables: [CraftSession.crafters, recipeBurstMagnitude, benchPosition]
    output_range: [N independent emissions where N = |crafters| at BT3 moment]
    source: design/gdd/crafting-and-items.md (D.3)
    referenced_by: []
    notes: "BT3 dispatch loop. N independent ED emissions at same position, distinct sourcePlayerId per crafter. Iterates the array AT BT3 moment (snapshot, not historical — per H.50 deserter-exploit closure). N <= BENCH_MAX_CRAFTERS = 2 enforces ED.C.1.2 reserved-band compliance (each emission < 0.85)."

  # compositePatchDowngrade (D.4) removed 2026-06-01 round-2 patch — Composite Patch recipe cut.
  #   RN no longer applies any gather-magnitude downgrade; it emits the nominal node-tier magnitude.
  # quietStepWrapReduction (D.5) removed 2026-06-01 round-2 patch — Quiet Step Wrap recipe cut.
  #   The Dampener Coil (dampenerCoilReduction below) is the only surviving emission modifier; its
  #   single interaction with PC stationary attenuation is the canonical order-of-operations (D.6a).

  - name: dampenerCoilReduction
    category: formula
    expression: "magnitude_out = magnitude_base * (1 - DAMPENER_REDUCTION) (= 0.08 * (1 - 0.50) = 0.04 at default); applied to ALL Light pulses by equipped player while Coil active; Coil NOT consumed per pulse (consumed on equip, expires on duration/bench-visit/death)"
    variables: [magnitude_base, DAMPENER_REDUCTION, DAMPENER_DURATION]
    output_range: [0.024, 0.056]
    source: design/gdd/crafting-and-items.md (D.6)
    referenced_by: []
    notes: "Light-pulse magnitude reduction applied by Dampener Coil while active. DAMPENER_REDUCTION is a FRACTIONAL reduction (the multiplier is (1 - DAMPENER_REDUCTION)), per GDD D.6 — NOT a direct multiplier. At default 0.50 the multiplier is 0.50, but over the tuning range [0.30, 0.70] the output spans [0.056, 0.024] (higher DAMPENER_REDUCTION = stronger reduction = lower output). output_range corrected 2026-06-01 (round-2 re-review BLOCKING-1: prior `* DAMPENER_REDUCTION` form diverged from the GDD at every non-default tuning). Stationary Coil-equipped players' effective pulse: 0.08 * (1 - 0.50) * STATIONARY_EMISSION_FACTOR = 0.012 < MAGNITUDE_FLOOR = 0.02 — discarded by ED, Coil NOT consumed for that pulse (per H.38)."

  - name: beaconMidpulseTrigger
    category: formula
    expression: "if not CraftSession.midpulseFired and craftProgress >= CRAFT_BEACON_MIDPULSE_PROGRESS: DisturbanceService:Emit('Craft', CraftSession.benchPosition, MAGNITUDE_CRAFT_BEACON_MIDPULSE, CraftSession.primaryCrafterId); CraftSession.midpulseFired = true"
    variables: [craftProgress, CRAFT_BEACON_MIDPULSE_PROGRESS, MAGNITUDE_CRAFT_BEACON_MIDPULSE]
    output_range: [single emission per Beacon craft session]
    source: design/gdd/crafting-and-items.md (D.7)
    referenced_by: []
    notes: "Edge-detected one-shot midpulse for Beacon recipe only. Idempotent via midpulseFired flag (per H.39). Attribution: CraftSession.primaryCrafterId = the stable BT1 initiator (round-2 B7 2026-06-01 — NOT crafters[1], which can shift if the initiator departs via BT4; per H.41). Position: CraftSession.benchPosition (schema field added round-2 B8)."

