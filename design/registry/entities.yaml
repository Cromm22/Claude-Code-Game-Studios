  # Player Controller formulas (encoded 2026-04-30).

  - name: staminaDrain
    category: formula
    expression: "stamina_new = clamp(stamina - STAMINA_DRAIN_RATE * dt, 0, STAMINA_MAX)"
    variables: [stamina, STAMINA_DRAIN_RATE, dt, STAMINA_MAX]
    output_range: [0, 200]
    source: design/gdd/player-controller.md (D.1)
    referenced_by: []
    notes: "Per-Heartbeat stamina deduction while in S2 (Alive-Sprinting). dt sourced from RunService.Heartbeat event arg (typical 1/60s server, up to 1/30s on slow servers; dt = math.max(0, dt) negative-dt guard per R12-SD-6). Clamp to 0 prevents negative on lag spike. output_range upper bound = STAMINA_MAX across the G.2 product space (range 60-200; 0-100 at the default STAMINA_MAX = 100) — round-16 B6d un-pinned it from the default."

  - name: staminaRegen
    category: formula
    expression: "stamina_new = clamp(stamina + STAMINA_REGEN_RATE * dt, 0, STAMINA_MAX)"
    variables: [stamina, STAMINA_REGEN_RATE, dt, STAMINA_MAX]
    output_range: [0, 200]
    source: design/gdd/player-controller.md (D.2)
    referenced_by: []
    notes: "Per-Heartbeat stamina recovery while NOT in S2 AND past STAMINA_REGEN_DELAY (strict '>' gate, R6-I1). Delay is gated by caller, not by this formula. dt = math.max(0, dt) negative-dt guard per R12-SD-6. output_range upper bound = STAMINA_MAX across the G.2 product space (range 60-200; 0-100 at the default STAMINA_MAX = 100) — round-16 B6d un-pinned it from the default."

  - name: effectiveSprintDuration
    category: formula
    expression: "T_sprint(s_0) = s_0 / STAMINA_DRAIN_RATE"
    variables: [s_0, STAMINA_DRAIN_RATE]
    output_range: [0.0, 25.0]
    source: design/gdd/player-controller.md (D.3)
    referenced_by: []
    notes: "Seconds of uninterrupted sprint until forced-walk, given starting stamina. 8.0 s at default config (s_0 = STAMINA_MAX = 100, drain 12.5); TRUE MAXIMUM across the combined G.2 product space is 25.0 s (STAMINA_MAX = 200 / STAMINA_DRAIN_RATE = 8) — round-16 B6b corrected the default-pinned 8.0 upper bound. STAMINA_DRAIN_RATE > 0 is a load-bearing config-validation floor (R12-SD-3 — division by zero at 0)."

  - name: pulseEmissionMagnitude
    category: formula
    expression: "axis = emissionType; grace_eligible = (t_lastGracePulse[axis] == nil) OR ((t_0 - t_lastGracePulse[axis]) >= GRACE_REENTRY_COOLDOWN); if grace_eligible: record t_lastGracePulse[axis] = t_0 (Step 0a anchor-on-eligibility, B9 -- recorded at eligibility resolution regardless of whether the first pulse fires within FIRST_PULSE_GRACE_WINDOW); effective_d = (d_xz < MOBILE_ANALOG_DRIFT_THRESHOLD AND platform == 'touch') ? 0 : d_xz; if grace_eligible AND (t - t_0) <= FIRST_PULSE_GRACE_WINDOW: magnitude_out = magnitude_base; elif effective_d < EMITTER_MOVEMENT_DELTA_FLOOR: magnitude_out = magnitude_base * STATIONARY_EMISSION_FACTOR; else: magnitude_out = magnitude_base; if axis == 'Sprint': magnitude_out = max(SPRINT_HOLD_FLOOR, magnitude_out) (Step 2 Sprint hold-floor, R10-6/[R13-F1])"
    variables: [t, t_0, d_xz, effective_d, axis, t_lastGracePulse, MOBILE_ANALOG_DRIFT_THRESHOLD, EMITTER_MOVEMENT_DELTA_FLOOR, FIRST_PULSE_GRACE_WINDOW, GRACE_REENTRY_COOLDOWN, magnitude_base, STATIONARY_EMISSION_FACTOR, SPRINT_HOLD_FLOOR, platform]
    output_range: [0.024, 0.10]
    source: design/gdd/player-controller.md (D.4)
    referenced_by: []
    notes: "Pulse magnitude sent to DisturbanceService:Emit for Sprint or Light pulses. Discrete output set: {0.024, 0.08, 0.09, 0.10} — Sprint stationary = 0.09 via the Step-2 hold-floor max(SPRINT_HOLD_FLOOR, 0.10 x 0.30 = 0.03) per R10-6 at the [R13-F1] value; the pre-R10-6 0.03 output is UNREACHABLE (round-16 B6a removed the dead 0.03 from this set and added the missing Step-2 max() to the expression). Light stationary stays 0.024 (no floor — Light axis). Drift floor applies on touch only (PC/gamepad bypass to avoid false-stationary classification). Round-2 Theme 1 G1 closure: grace_eligible preflight gates the grace-window branch via per-axis cooldown (t_lastGracePulse[axis], GRACE_REENTRY_COOLDOWN = 6.0s default). Without preflight, round-1 micro-cadence exploits cycled at 31% cost-per-pulse for Sprint, 10x for Light. The OnSprintPulse {variant} transport (PC C.9, round-16 B1) reports which branch fired to the emitting client."

  - name: xzDisplacement
    category: formula
    expression: "d_xz = sqrt((x_n - x_{n-1})^2 + (z_n - z_{n-1})^2)"
    variables: [x_n, z_n, x_{n-1}, z_{n-1}]
    output_range: [0.0, infinity]
    source: design/gdd/player-controller.md (D.6)
    referenced_by: []
    notes: "XZ-plane displacement of HumanoidRootPart between consecutive pulse fire events. Y/vertical motion discarded (jump-in-place produces 0). First-pulse special case: previous position = state-entry position; result is consumed by D.4 grace branch and unused."

  # Crafting & Items formulas (encoded 2026-04-30).

  - name: craftProgress
    category: formula
    expression: "craftProgress = clamp(progressAtRateAnchor + ((_clock() - rateAnchorClock) * crafterSpeedMultiplier_N) / CRAFT_BASE_DWELL_TIME, 0, 1)  # clock-elapsed closed form (round-5 R4-3 + qa-gate refinement); piecewise across rate changes (BT2/BT4 reset progressAtRateAnchor=craftProgress, rateAnchorClock=_clock())"
    variables: [progressAtRateAnchor, rateAnchorClock, _clock, crafterSpeedMultiplier_N, CRAFT_BASE_DWELL_TIME]
    output_range: [0.0, 1.0]
    source: design/gdd/crafting-and-items.md (D.1, D.2)
    referenced_by: []
    notes: "CLOCK-ELAPSED CLOSED FORM (round-5 R4-3 2026-06-02, refined per the round-5 qa-lead gate). REPLACED the per-tick accumulator `craftProgress + craftRate*dt` (drifted +/-1-2 ULP over 300-600 additions — round-4 IEEE-754 finding). The qa-gate found the CD's literal `stepCount*dt` form was ALSO (a) incorrect under variable Heartbeat dt (storedSteps*currentDt != true elapsed time) and (b) not provably exact (600*(1/60)/10 may not == 1.0 in IEEE-754 double). FIX: drive progress from elapsed server time (_clock() - rateAnchorClock), NOT step*dt. Each Heartbeat: recompute craftProgress fresh from _clock() (no accumulation, no stored step count). On a rate change (BT2 join / BT4 depart): progressAtRateAnchor = current craftProgress, rateAnchorClock = _clock(). Division is BY CRAFT_BASE_DWELL_TIME, NOT a multiply by a precomputed 1/dwell reciprocal. crafterSpeedMultiplier_N = crafterSpeedMultiplier(N) per D.2 (the single canonical name; this was the old `effective_N`). Tested exact via the C.16 _clock seam set to exact dwell boundaries (10.0/10.0, 5.0*2/10.0, 2.0/2.0 — all exactly representable) by H.27/H.28/H.30/H.31/H.41. Clamp to 1.0 prevents BT3 double-fire (H.29). Consistent with the survival-window timer C.5.6 (_clock() - beaconActivationTime)."

  - name: multiCrafterDwellRate
    category: formula
    expression: "effective_N = min(N, benchMaxCraftersEffective) where N = |CraftSession.crafters| and benchMaxCraftersEffective = min(BENCH_MAX_CRAFTERS, ceil(squadSize/2))"
    variables: [N, benchMaxCraftersEffective, BENCH_MAX_CRAFTERS, squadSize]
    output_range: [1, 2]
    source: design/gdd/crafting-and-items.md (D.2, C.3.5)
    referenced_by: []
    notes: "Multi-crafter dwell-time scalar. NAMING (round-5 unification per qa-gate): `effective_N` here == the GDD's `crafterSpeedMultiplier(N)` (D.2) == the `crafterSpeedMultiplier_N` factor in the craftProgress closed form — ONE quantity, three historical names; canonical name is `crafterSpeedMultiplier(N)`. N=1 gives 1× rate; N=2 gives 2× rate (half wall-clock dwell). Clamped at the squad-scaled benchMaxCraftersEffective (round-2 2026-06-01: was a flat BENCH_MAX_CRAFTERS) to enforce E.2 over-cap rejection. In a 2-player squad the effective cap is 1, so the speedup is unavailable (BS3 unreachable). Progress preserved when N changes mid-craft (per H.31)."

  - name: multiCrafterEmissionDispatch
    category: formula
    expression: "for crafter in CraftSession.crafters: DisturbanceService:Emit(emissionType='Craft', position=benchPosition, initialMagnitude=recipeBurstMagnitude, sourcePlayerId=crafter.UserId)"
    variables: [CraftSession.crafters, recipeBurstMagnitude, benchPosition]
    output_range: [N independent emissions where N = |crafters| at BT3 moment]
    source: design/gdd/crafting-and-items.md (D.3)
    referenced_by: []
    notes: "BT3 dispatch loop. N independent ED emissions at same position, distinct sourcePlayerId per crafter. Iterates the array AT BT3 moment (snapshot, not historical — per H.50 deserter-exploit closure). N <= BENCH_MAX_CRAFTERS = 2 enforces ED.C.1.2 reserved-band compliance (each emission < 0.85)."

  # compositePatchDowngrade (D.4) removed 2026-06-01 round-2 patch — Composite Patch recipe cut.
  #   RN no longer applies any gather-magnitude downgrade; it emits the nominal node-tier magnitude.
  # quietStepWrapReduction (D.5) removed 2026-06-01 round-2 patch — Quiet Step Wrap recipe cut.
  #   The Dampener Coil (dampenerCoilReduction below) is the only surviving emission modifier; its
  #   single interaction with PC stationary attenuation is the canonical order-of-operations (D.6a).

  - name: dampenerCoilReduction
    category: formula
    expression: "magnitude_out = magnitude_base * (1 - DAMPENER_REDUCTION) (= 0.08 * (1 - 0.50) = 0.04 at default); applied to ALL Light pulses by equipped player while Coil active; Coil NOT consumed per pulse (consumed on equip, expires on duration/bench-visit/death)"
    variables: [magnitude_base, DAMPENER_REDUCTION, DAMPENER_DURATION]
    output_range: [0.024, 0.056]
    source: design/gdd/crafting-and-items.md (D.6)
    referenced_by: []
    notes: "Light-pulse magnitude reduction applied by Dampener Coil while active. DAMPENER_REDUCTION is a FRACTIONAL reduction (the multiplier is (1 - DAMPENER_REDUCTION)), per GDD D.6 — NOT a direct multiplier. At default 0.50 the multiplier is 0.50, but over the tuning range [0.30, 0.70] the output spans [0.056, 0.024] (higher DAMPENER_REDUCTION = stronger reduction = lower output). output_range corrected 2026-06-01 (round-2 re-review BLOCKING-1: prior `* DAMPENER_REDUCTION` form diverged from the GDD at every non-default tuning). Stationary Coil-equipped players' effective pulse: 0.08 * (1 - 0.50) * STATIONARY_EMISSION_FACTOR = 0.012 < MAGNITUDE_FLOOR = 0.02 — discarded by ED, Coil NOT consumed for that pulse (per H.38)."

  - name: beaconMidpulseTrigger
    category: formula
    expression: "if not CraftSession.midpulseFired and craftProgress >= CRAFT_BEACON_MIDPULSE_PROGRESS: DisturbanceService:Emit('Craft', CraftSession.benchPosition, MAGNITUDE_CRAFT_BEACON_MIDPULSE, CraftSession.primaryCrafterId); CraftSession.midpulseFired = true"
    variables: [craftProgress, CRAFT_BEACON_MIDPULSE_PROGRESS, MAGNITUDE_CRAFT_BEACON_MIDPULSE]
    output_range: [single emission per Beacon craft session]
    source: design/gdd/crafting-and-items.md (D.7)
    referenced_by: []
    notes: "Edge-detected one-shot midpulse for Beacon recipe only. Idempotent via midpulseFired flag (per H.39). Attribution: CraftSession.primaryCrafterId = the stable BT1 initiator (round-2 B7 2026-06-01 — NOT crafters[1], which can shift if the initiator departs via BT4; per H.41). Position: CraftSession.benchPosition (schema field added round-2 B8)."

