  # Player Controller round-2 Theme 1 additions (encoded 2026-05-01 from /design-system player-controller round-2 Pillar 1 closure).

  - name: HP_IMMINENT_THRESHOLD
    category: constant
    value: 25
    unit: HP
    source: design/gdd/player-controller.md (C.5.3, E.E, G.6)
    referenced_by: []
    notes: "Health arm of the imminent-death predicate (C.5.3 Path B). On Players.PlayerRemoving, if Humanoid.Health < this value, the disconnecting player pays the squad oxygen cost. Composite OR with DAMAGE_RECENT_WINDOW. Range: 10-50 HP. Round-2 Theme 1 N1 closure. Boundary semantics (B11 round-4): comparator is strict '<', NOT '<='. HP exactly equal to 25.0 does NOT fire arm 1. Asymmetric with E.F PING_COOLDOWN >= precedent — imminent-death cost attribution favors squad-friendly rejection at boundary (off-by-one over-charges are worse than off-by-one under-charges for Pillar 2 cost legitimacy)."

  - name: DAMAGE_RECENT_WINDOW
    category: constant
    value: 3.0
    unit: seconds
    source: design/gdd/player-controller.md (C.5.3, E.E, G.6)
    referenced_by: []
    notes: "Recent-damage arm (arm 2) of the imminent-death predicate (C.5.3 Path B). On Players.PlayerRemoving, if (now - lastPredatorDamageTimestamp[player]) < this value, disconnecting player pays squad oxygen cost. Composite OR with HP_IMMINENT_THRESHOLD-bound arm 1. Range: 1.5-5.0s. Round-2 Theme 1 N1 closure. Reads from PredatorService-owned table (cross-system invariant per F.4). Boundary semantics (B11 round-4): comparator is strict '<', NOT '<='. Elapsed time exactly equal to 3.0s does NOT satisfy arm 2."

  - name: HP_ARM_RECENT_WINDOW
    category: constant
    value: 30.0
    unit: seconds
    source: design/gdd/player-controller.md (C.5.3, E.E, G.6)
    referenced_by: []
    notes: "Time-bound on arm 1 (HP arm) of the imminent-death predicate (C.5.3 Path B). Arm 1 fires only if Humanoid.Health < HP_IMMINENT_THRESHOLD AND lastPredatorDamageTimestamp[player] ~= nil AND (now - lastPredatorDamageTimestamp[player]) < HP_ARM_RECENT_WINDOW. Range: 15-60s. Round-3 Pillar 2 closure — closes the stale-graze false-positive (a 10-minute-old predator graze plus oxygen-depletion death no longer triggers Path B). Reads from PredatorService-owned table (cross-system invariant per F.4). Boundary semantics (B11 round-4): comparator is strict '<', NOT '<='. Elapsed time exactly equal to 30.0s does NOT satisfy arm 1's recency check."

  - name: GRACE_REENTRY_COOLDOWN
    category: constant
    value: 6.0
    unit: seconds
    source: design/gdd/player-controller.md (C.8.1, C.8.2, D.4, E.C, G.6)
    referenced_by: []
    notes: "Per-axis cooldown between grace-exempt first pulses for Sprint and Light emissions. Closes round-1 G1 grace-window first-pulse cadence exploit (Sprint ~31% cost cycle; Light 10x exploit factor). Per-axis tracking: t_lastGracePulse_sprint, t_lastGracePulse_light. Reset to nil on T5 (Humanoid.Died) per Pillar 4 fairness. Range: 4.0-12.0s. Floor justification: max(SPRINT_PULSE_INTERVAL + STAMINA_REGEN_DELAY, LIGHT_PULSE_INTERVAL) = 4.0s. Round-2 Theme 1 G1 closure."

  - name: HEARTBEAT_SEND_RATE
    category: constant
    value: 1
    unit: Hz
    source: design/gdd/player-controller.md (E.D, C.9, G.6, H.33a/b/c)
    referenced_by: []
    notes: "PlayerHeartbeat RemoteEvent send rate. Client fires while in S2 (sprinting) only; server drops while in S1/S4/S5. Defines the SPRINT_CLIENT_TIMEOUT enforcement floor — 3 heartbeats fit in the 3s window. Bandwidth: ~160 B/s worst case at 4 sprinting players. Round-2 Theme 1 N2 closure (closes round-1 ghost-sprint exploit; heartbeat is NOT a sprint-authorization signal — sprint terminates at stamina=0 regardless). Range: 0.5-2 Hz."

